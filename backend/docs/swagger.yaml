info:
  contact: {}
  description: HTTP API for Coyote CI control-plane workflows.
  title: Coyote CI API
  version: "0.1"
paths:
  /artifact-trigger-deliveries/{deliveryID}/retry:
    post:
      description: Retries a failed artifact-trigger delivery by delivery id.
      parameters:
      - description: Delivery ID
        in: path
        name: deliveryID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildArtifactTriggerDeliveryRetryEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Retry artifact trigger delivery
      tags:
      - artifact-trigger-deliveries
  /artifacts:
    get:
      description: Returns logical artifacts grouped with their available versions
        for artifact repository browsing.
      parameters:
      - description: Search artifacts by path, project, job, version label, or channel
        in: query
        name: q
        type: string
      - description: Artifact type filter
        enum:
        - docker_image
        - npm_package
        - generic
        - unknown
        in: query
        name: type
        type: string
      - description: Filter artifacts by project id
        in: query
        name: project_id
        type: string
      - description: Filter artifacts by project slug
        in: query
        name: project_slug
        type: string
      - description: Filter artifacts by producing job id
        in: query
        name: job_id
        type: string
      - description: Max logical artifacts to return
        in: query
        name: limit
        type: integer
      - description: Number of logical artifacts to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ArtifactBrowseEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List logical artifacts
      tags:
      - artifacts
  /artifacts/{artifactID}:
    get:
      description: Returns one persisted artifact instance with build, job, step,
        and stable download metadata.
      parameters:
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ArtifactDetailEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get artifact detail
      tags:
      - artifacts
  /artifacts/{artifactID}/version-tags:
    get:
      description: Returns immutable version tags attached to one artifact.
      parameters:
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List artifact version tags
      tags:
      - version-tags
  /artifacts/catalog:
    get:
      description: Returns persisted artifact metadata rows across builds for artifact
        catalog browsing. Use /artifacts for the grouped logical artifact browser.
      parameters:
      - description: Search artifacts by path, name, artifact id, build id, build
          number, or job id
        in: query
        name: q
        type: string
      - description: Filter artifacts by project id
        in: query
        name: project_id
        type: string
      - description: Filter artifacts by project slug
        in: query
        name: project_slug
        type: string
      - description: Filter artifacts by producing job id
        in: query
        name: job_id
        type: string
      - description: Filter artifacts by producing build id
        in: query
        name: build_id
        type: string
      - description: Max artifacts to return
        in: query
        name: limit
        type: integer
      - description: Number of artifacts to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ArtifactCatalogEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List persisted artifact instances
      tags:
      - artifacts
  /builds:
    get:
      description: Lists builds sorted by newest first with optional pagination and
        project filters.
      parameters:
      - description: Max results (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Number of results to skip
        in: query
        name: offset
        type: integer
      - description: Filter builds by project id
        in: query
        name: project_id
        type: string
      - description: Filter builds by project slug
        in: query
        name: project_slug
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List builds
      tags:
      - builds
    post:
      consumes:
      - application/json
      description: Creates a new build in pending status.
      parameters:
      - description: Build create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateBuildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create build
      tags:
      - builds
  /builds/{buildID}:
    get:
      description: Returns build details by id.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get build
      tags:
      - builds
  /builds/{buildID}/artifact-triggers:
    get:
      description: Returns persisted producer-side artifact trigger delivery records
        for a build.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildArtifactTriggerDeliveriesEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List build artifact trigger deliveries
      tags:
      - builds
