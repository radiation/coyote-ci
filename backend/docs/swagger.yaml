        type: string
      sequence_no:
        type: integer
      step_id:
        type: string
      step_index:
        type: integer
      step_name:
        type: string
      stream:
        type: string
    type: object
  api.StepLogsEnvelope:
    properties:
      data:
        $ref: '#/definitions/api.StepLogsResponse'
    type: object
  api.StepLogsResponse:
    properties:
      after:
        type: integer
      build_id:
        type: string
      chunks:
        items:
          $ref: '#/definitions/api.StepLogChunkResponse'
        type: array
      next_sequence:
        type: integer
      step_index:
        type: integer
    type: object
  api.StringPatch:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  api.UpdateJobManagedImageConfigRequest:
    properties:
      bot_branch_prefix:
        type: string
      commit_author_email:
        type: string
      commit_author_name:
        type: string
      enabled:
        type: boolean
      managed_image_name:
        type: string
      pipeline_path:
        type: string
      write_credential_id:
        type: string
    type: object
  api.UpdateJobRequest:
    properties:
      branch_allowlist:
        items:
          type: string
        type: array
      default_commit_sha:
        type: string
      default_ref:
        type: string
      enabled:
        type: boolean
      managed_image:
        $ref: '#/definitions/api.UpdateJobManagedImageConfigRequest'
      name:
        type: string
      pipeline_path:
        type: string
      pipeline_yaml:
        type: string
      priority:
        type: integer
      push_branch:
        type: string
      push_enabled:
        type: boolean
      repository_url:
        type: string
      tag_allowlist:
        items:
          type: string
        type: array
      trigger_mode:
        type: string
    type: object
  api.UpdateProjectRequest:
    properties:
      description:
        $ref: '#/definitions/api.StringPatch'
      name:
        type: string
      slug:
        type: string
    type: object
  api.UpdateUserRequest:
    properties:
      display_name:
        $ref: '#/definitions/api.StringPatch'
      email:
        type: string
      global_role:
        type: string
    type: object
  api.UpsertProjectMembershipRequest:
    properties:
      role:
        type: string
    type: object
  api.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/api.UserResponse'
    type: object
  api.UserListEnvelope:
    properties:
      data:
        $ref: '#/definitions/api.UserListResponse'
    type: object
  api.UserListResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/api.UserResponse'
        type: array
    type: object
  api.UserResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      global_role:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  api.VersionTagCreateRequest:
    properties:
      artifact_ids:
        items:
          type: string
        type: array
      kind:
        type: string
      managed_image_version_ids:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
  api.VersionTagResponse:
    properties:
      artifact_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      job_id:
        type: string
      kind:
        type: string
      managed_image_version_id:
        type: string
      target_type:
        type: string
      version:
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for Coyote CI control-plane workflows.
  title: Coyote CI API
  version: "0.1"
paths:
  /artifacts:
    get:
      description: Returns logical artifacts grouped with their available versions
        for artifact repository browsing.
      parameters:
      - description: Search artifacts by path, project, job, version label, or channel
        in: query
        name: q
        type: string
      - description: Artifact type filter
        enum:
        - docker_image
        - npm_package
        - generic
        - unknown
        in: query
        name: type
        type: string
      - description: Filter artifacts by project id
        in: query
        name: project_id
        type: string
      - description: Filter artifacts by project slug
        in: query
        name: project_slug
        type: string
      - description: Filter artifacts by producing job id
        in: query
        name: job_id
        type: string
      - description: Max logical artifacts to return
        in: query
        name: limit
        type: integer
      - description: Number of logical artifacts to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ArtifactBrowseEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List logical artifacts
      tags:
      - artifacts
  /artifacts/{artifactID}:
    get:
      description: Returns one persisted artifact instance with build, job, step,
        and stable download metadata.
      parameters:
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ArtifactDetailEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get artifact detail
      tags:
      - artifacts
  /artifacts/{artifactID}/version-tags:
    get:
      description: Returns immutable version tags attached to one artifact.
      parameters:
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List artifact version tags
      tags:
      - version-tags
  /artifacts/catalog:
    get:
      description: Returns persisted artifact metadata rows across builds for artifact
        catalog browsing. Use /artifacts for the grouped logical artifact browser.
      parameters:
      - description: Search artifacts by path, name, artifact id, build id, build
          number, or job id
        in: query
        name: q
        type: string
      - description: Filter artifacts by project id
        in: query
        name: project_id
        type: string
      - description: Filter artifacts by project slug
        in: query
        name: project_slug
        type: string
      - description: Filter artifacts by producing job id
        in: query
        name: job_id
        type: string
      - description: Filter artifacts by producing build id
        in: query
        name: build_id
        type: string
      - description: Max artifacts to return
        in: query
        name: limit
        type: integer
      - description: Number of artifacts to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ArtifactCatalogEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List persisted artifact instances
      tags:
      - artifacts
  /builds:
    get:
      description: Lists builds sorted by newest first with optional pagination and
        project filters.
      parameters:
      - description: Max results (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Number of results to skip
        in: query
        name: offset
        type: integer
      - description: Filter builds by project id
        in: query
        name: project_id
        type: string
      - description: Filter builds by project slug
        in: query
        name: project_slug
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List builds
      tags:
      - builds
    post:
      consumes:
      - application/json
      description: Creates a new build in pending status.
      parameters:
      - description: Build create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateBuildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create build
      tags:
      - builds
  /builds/{buildID}:
    get:
      description: Returns build details by id.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get build
      tags:
      - builds
  /builds/{buildID}/artifacts:
    get:
      description: Returns persisted artifact metadata for a build.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildArtifactsEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List build artifacts
      tags:
      - builds
  /builds/{buildID}/artifacts/{artifactID}/download:
    get:
      description: Streams stored artifact content for a build artifact.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: binary payload
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Download build artifact
      tags:
      - builds
  /builds/{buildID}/cancel:
    post:
      description: Marks a queued or running build as canceled and terminalizes cancellable
        steps/jobs.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Cancel build
      tags:
      - builds
  /builds/{buildID}/complete:
    post:
      description: Transitions build status from running to success.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Complete build
      tags:
      - builds
  /builds/{buildID}/fail:
    post:
      description: Transitions build status from running to failed.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Fail build
      tags:
      - builds
  /builds/{buildID}/logs:
    get:
      description: Returns log lines for a build.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildLogsEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get build logs
      tags:
      - builds
  /builds/{buildID}/queue:
    post:
      consumes:
      - application/json
      description: Transitions build status from pending to queued.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      - description: Queue build request
        in: body
        name: request
        schema:
          $ref: '#/definitions/api.QueueBuildRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Queue build
      tags:
      - builds
  /builds/{buildID}/rerun:
    post:
      description: Creates a new queued build using the source, trigger, job, and
        step context from an existing build.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Rerun build
      tags:
      - builds
  /builds/{buildID}/start:
    post:
      description: Transitions build status from queued to running.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Start build
      tags:
      - builds
  /builds/{buildID}/steps:
    get:
      description: Returns steps for a build.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BuildStepsEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get build steps
      tags:
      - builds
  /builds/{buildID}/steps/{stepIndex}/logs:
    get:
      description: Returns persisted log chunks for a build step.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      - description: Step index
        in: path
        name: stepIndex
        required: true
        type: integer
      - description: Replay cursor (exclusive sequence number)
        in: query
        name: after
        type: integer
      - description: Maximum chunks to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StepLogsEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get build step logs
      tags:
      - builds
  /builds/{buildID}/steps/{stepIndex}/logs/stream:
    get:
      description: Streams build step log chunks over SSE with cursor resume support.
      parameters:
      - description: Build ID
        in: path
        name: buildID
        required: true
        type: string
      - description: Step index
        in: path
        name: stepIndex
        required: true
        type: integer
      - description: Replay cursor (exclusive sequence number)
        in: query
        name: after
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Stream build step logs
      tags:
      - builds
  /builds/jobs/{jobID}/retry:
    post:
      description: Creates a new build attempt containing a retry of the failed execution
        job.
      parameters:
      - description: Execution Job ID
        in: path
        name: jobID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RetryJobEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Retry failed execution job
      tags:
      - builds
  /builds/pipeline:
    post:
      consumes:
      - application/json
      description: Parses and validates pipeline YAML, then creates a queued build
        with resolved steps.
      parameters:
      - description: Pipeline build create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreatePipelineBuildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create build from pipeline YAML
      tags:
      - builds
  /builds/repo:
    post:
      consumes:
      - application/json
      description: Clones a repository, loads .coyote/pipeline.yml, then creates a
        queued build.
      parameters:
      - description: Repo build create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateRepoBuildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BuildEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create build from repository
      tags:
      - builds
  /events/push:
    post:
      consumes:
      - application/json
      description: Triggers builds for matching enabled jobs configured for push events.
      parameters:
      - description: Push event payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PushEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PushEventEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Ingest push event
      tags:
      - events
  /health:
    get:
      description: Returns a simple liveness response.
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /jobs:
    get:
      description: Lists jobs with optional pagination.
      parameters:
      - description: Max results (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Number of results to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobListEnvelope'
        "500":
          description: Internal Server Error
          schema:
