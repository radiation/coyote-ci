# Codecov configuration for a polyglot repo (Go backend + TypeScript frontend).
#
# Each side uploads separately with a flag. The carryforward setting ensures
# PRs that only touch one side still show a complete coverage picture.

fixes:
  # Go coverage profiles use the backend module import path; map it back to the
  # repository-relative backend/ directory for Codecov.
  - "github.com/radiation/coyote-ci/backend/::backend/"
  # Vitest lcov output is rooted at frontend/src, but reports files as src/*.
  - "src/::frontend/src/"

coverage:
  status:
    project:
      default:
        target: auto
      backend:
        flags: [backend]
      frontend:
        flags: [frontend]
    patch:
      default:
        target: 80%

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
