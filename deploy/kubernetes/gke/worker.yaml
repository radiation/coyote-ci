apiVersion: v1
kind: ServiceAccount
metadata:
  name: coyote-workspace-helper
  namespace: coyote-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coyote-kubernetes-worker
  namespace: coyote-ci
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coyote-workspace-helper
  namespace: coyote-ci
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coyote-kubernetes-worker
  namespace: coyote-ci
subjects:
  - kind: ServiceAccount
    name: coyote-kubernetes-worker
    namespace: coyote-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coyote-kubernetes-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coyote-workspace-helper
  namespace: coyote-ci
subjects:
  - kind: ServiceAccount
    name: coyote-workspace-helper
    namespace: coyote-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coyote-workspace-helper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coyote-kubernetes-worker
  namespace: coyote-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coyote-kubernetes-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coyote-kubernetes-worker
    spec:
      serviceAccountName: coyote-kubernetes-worker
      containers:
        - name: worker
          image: us-central1-docker.pkg.dev/bryanchoate/coyote-ci/coyote-worker:gke-smoke
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          env:
            - name: DATABASE_URL_FILE
              value: /var/run/secrets/coyote/database-url
            - name: WORKER_EXECUTION_BACKEND
              value: kubernetes
            - name: WORKER_KUBERNETES_NAMESPACE
              value: coyote-ci
            - name: WORKER_KUBERNETES_HELPER_IMAGE
              value: us-central1-docker.pkg.dev/bryanchoate/coyote-ci/coyote-worker:gke-smoke
            - name: WORKER_KUBERNETES_INTERNAL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: coyote-gke-worker
                  key: WORKER_KUBERNETES_INTERNAL_API_URL
            - name: COYOTE_WORKSPACE_HELPER_SERVICE_ACCOUNT
              value: coyote-workspace-helper
            - name: COYOTE_KUBERNETES_CACHE_HELPER_ENABLED
              value: "true"
            - name: COYOTE_KUBERNETES_ARTIFACT_HELPER_ENABLED
              value: "true"
            - name: WORKER_STEP_LEASE_SECONDS
              value: "45"
            - name: EMAIL_NOTIFICATIONS_ENABLED
              value: "false"
          volumeMounts:
            - name: database-url
              mountPath: /var/run/secrets/coyote
              readOnly: true
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4@sha256:88501f0a695a586988add1b8a206fdf3f29f9a1a3deeb9b45ef2b1481ea6be83
          args:
            - --address=127.0.0.1
            - --port=5432
            - bryanchoate:us-central1:bryanchoate-postgres
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: database-url
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: coyote-database-secrets