apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coyote-temporary-public
  namespace: coyote-ci
  annotations:
    networking.gke.io/certmap: __GATEWAY_CERTIFICATE_MAP__
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: __GATEWAY_ADDRESS_NAME__
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: __TEMPORARY_HOSTNAME__
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: __TEMPORARY_HOSTNAME__
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coyote-temporary-http-redirect
  namespace: coyote-ci
spec:
  parentRefs:
    - name: coyote-temporary-public
      sectionName: http
  hostnames:
    - __TEMPORARY_HOSTNAME__
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coyote-temporary-public
  namespace: coyote-ci
spec:
  parentRefs:
    - name: coyote-temporary-public
      sectionName: https
  hostnames:
    - __TEMPORARY_HOSTNAME__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: coyote-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: coyote-server
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: coyote-server
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /readyz
      backendRefs:
        - name: coyote-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /swagger
      backendRefs:
        - name: coyote-server
          port: 8080
    - backendRefs:
        - name: coyote-frontend
          port: 3000
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: coyote-server-public
  namespace: coyote-ci
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /readyz
  targetRef:
    group: ""
    kind: Service
    name: coyote-server
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: coyote-frontend-public
  namespace: coyote-ci
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /
  targetRef:
    group: ""
    kind: Service
    name: coyote-frontend
