apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.worker.name }}
  namespace: {{ .Values.namespace }}
  {{- if and .Values.gke.enabled .Values.gke.workloadIdentity.enabled }}
  annotations: {iam.gke.io/gcp-service-account: {{ .Values.serviceAccounts.worker.gsaEmail | quote }}}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Values.serviceAccounts.helper.name }}, namespace: {{ .Values.namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: coyote-kubernetes-worker-staging, namespace: {{ .Values.namespace }}}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: coyote-workspace-helper, namespace: {{ .Values.namespace }}}
rules: [{apiGroups: [""], resources: ["pods"], verbs: ["get"]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: coyote-server-workspace-verifier, namespace: {{ .Values.namespace }}}
rules: [{apiGroups: [""], resources: ["pods"], verbs: ["get"]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: coyote-kubernetes-worker-staging, namespace: {{ .Values.namespace }}}
subjects: [{kind: ServiceAccount, name: {{ .Values.serviceAccounts.worker.name }}, namespace: {{ .Values.namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: coyote-kubernetes-worker-staging}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: coyote-workspace-helper, namespace: {{ .Values.namespace }}}
subjects: [{kind: ServiceAccount, name: {{ .Values.serviceAccounts.helper.name }}, namespace: {{ .Values.namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: coyote-workspace-helper}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: coyote-server-workspace-verifier, namespace: {{ .Values.namespace }}}
subjects: [{kind: ServiceAccount, name: {{ .Values.serviceAccounts.server.name }}, namespace: {{ .Values.controlPlaneNamespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: coyote-server-workspace-verifier}
---
{{- if and .Values.gke.enabled .Values.gke.secretManagerCSI.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: coyote-staging-worker-database-secrets, namespace: {{ .Values.namespace }}}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secrets.project }}/secrets/{{ .Values.secrets.databaseUrl }}/versions/latest"
        path: "database-url"
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: {name: coyote-gke-staging-worker, namespace: {{ .Values.namespace }}}
data:
  WORKER_KUBERNETES_INTERNAL_API_URL: "http://coyote-server.{{ .Values.controlPlaneNamespace }}.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: coyote-kubernetes-worker-staging, namespace: {{ .Values.namespace }}}
spec:
  {{- if not .Values.worker.replicasManagedExternally }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector: {matchLabels: {app.kubernetes.io/name: coyote-kubernetes-worker-staging}}
  template:
    metadata: {labels: {app.kubernetes.io/name: coyote-kubernetes-worker-staging}}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.worker.name }}
      containers:
        - name: worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          {{- with .Values.worker.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - {name: DATABASE_URL_FILE, value: /var/run/secrets/coyote/database-url}
            - {name: WORKER_EXECUTION_BACKEND, value: kubernetes}
            - {name: WORKER_KUBERNETES_NAMESPACE, value: {{ .Values.namespace }}}
            - {name: GOOGLE_CLOUD_PROJECT, value: {{ .Values.cloudBuild.project | quote }}}
            - {name: CLOUD_BUILD_LOCATION, value: {{ .Values.cloudBuild.location | quote }}}
            - {name: CLOUD_BUILD_RUNTIME_SERVICE_ACCOUNT, value: {{ .Values.cloudBuild.runtimeServiceAccount | quote }}}
            - {name: CLOUD_BUILD_ARTIFACT_REGISTRY_REPOSITORY, value: {{ .Values.cloudBuild.artifactRegistryRepository | quote }}}
            - {name: CLOUD_BUILD_SOURCE_BUCKET, value: {{ .Values.cloudBuild.source.bucket | quote }}}
            - {name: CLOUD_BUILD_SOURCE_PREFIX, value: {{ .Values.cloudBuild.source.prefix | quote }}}
            - {name: WORKER_KUBERNETES_MAX_IN_FLIGHT_JOBS, value: {{ .Values.worker.maxInFlightJobs | quote }}}
            - {name: WORKER_KUBERNETES_HELPER_IMAGE, value: {{ .Values.images.worker | quote }}}
            - name: WORKER_KUBERNETES_INTERNAL_API_URL
              valueFrom: {configMapKeyRef: {name: coyote-gke-staging-worker, key: WORKER_KUBERNETES_INTERNAL_API_URL}}
            - {name: COYOTE_WORKSPACE_HELPER_SERVICE_ACCOUNT, value: {{ .Values.serviceAccounts.helper.name }}}
            - {name: COYOTE_KUBERNETES_CACHE_HELPER_ENABLED, value: "true"}
            - {name: COYOTE_KUBERNETES_ARTIFACT_HELPER_ENABLED, value: "true"}
            - {name: WORKER_STEP_LEASE_SECONDS, value: "45"}
            - {name: ARTIFACT_STORAGE_PROVIDER, value: gcs}
            - {name: ARTIFACT_STORAGE_STRICT, value: "true"}
            - {name: ARTIFACT_GCS_BUCKET, value: {{ .Values.storage.artifacts.bucket | quote }}}
            - {name: ARTIFACT_GCS_PREFIX, value: {{ .Values.storage.artifacts.prefix | quote }}}
            - {name: ARTIFACT_GCS_PROJECT, value: {{ .Values.storage.project | quote }}}
            - {name: EMAIL_NOTIFICATIONS_ENABLED, value: "false"}
          {{- if and .Values.gke.enabled .Values.gke.secretManagerCSI.enabled }}
          volumeMounts: [{name: database-url, mountPath: /var/run/secrets/coyote, readOnly: true}]
          {{- end }}
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy }}
          args: [{{ printf "--address=%s" .Values.cloudSql.proxy.address | quote }}, {{ printf "--port=%v" .Values.cloudSql.proxy.port | quote }}, {{ .Values.cloudSql.connectionName | quote }}]
          ports: [{name: postgres, containerPort: 5432}]
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, seccompProfile: {type: RuntimeDefault}}
          resources: {{- toYaml .Values.cloudSql.proxy.resources | nindent 12 }}
      volumes:
        {{- if and .Values.gke.enabled .Values.gke.secretManagerCSI.enabled }}
        - name: database-url
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: coyote-staging-worker-database-secrets}
        {{- end }}
