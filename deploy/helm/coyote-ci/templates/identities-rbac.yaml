apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.server.name }}
  namespace: {{ (include "coyote-ci.namespace" .) }}
  {{- include "coyote-ci.annotations" (dict "root" . "account" .Values.serviceAccounts.server) | nindent 2 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.migrate.name }}
  namespace: {{ (include "coyote-ci.namespace" .) }}
  {{- include "coyote-ci.annotations" (dict "root" . "account" .Values.serviceAccounts.migrate) | nindent 2 }}
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.mcp.name }}
  namespace: {{ (include "coyote-ci.namespace" .) }}
  {{- include "coyote-ci.annotations" (dict "root" . "account" .Values.serviceAccounts.mcp) | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coyote-server-workspace-verifier
  namespace: {{ (include "coyote-ci.namespace" .) }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coyote-server-workspace-verifier
  namespace: {{ (include "coyote-ci.namespace" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.server.name }}
    namespace: {{ (include "coyote-ci.namespace" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coyote-server-workspace-verifier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "coyote-ci.tokenReviewName" . }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "coyote-ci.tokenReviewName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.server.name }}
    namespace: {{ (include "coyote-ci.namespace" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "coyote-ci.tokenReviewName" . }}
