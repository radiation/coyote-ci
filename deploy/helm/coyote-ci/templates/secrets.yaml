{{- if and .Values.gke.enabled .Values.gke.secretManagerCSI.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coyote-server-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secrets.project }}/secrets/{{ .Values.secrets.databaseUrl }}/versions/latest"
        path: "database-url"
      - resourceName: "projects/{{ .Values.secrets.project }}/secrets/{{ .Values.secrets.workspaceHelperCapability }}/versions/latest"
        path: "workspace-helper-capability-secret"
      - resourceName: "projects/{{ .Values.secrets.project }}/secrets/{{ .Values.secrets.oidcClient }}/versions/latest"
        path: "oidc-client-secret"
      - resourceName: "projects/{{ .Values.secrets.project }}/secrets/{{ .Values.secrets.session }}/versions/latest"
        path: "session-secret"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coyote-migrate-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secrets.project }}/secrets/{{ .Values.secrets.databaseUrl }}/versions/latest"
        path: "database-url"
{{- end }}
