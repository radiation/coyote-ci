{{- if .Values.migration.render }}
apiVersion: batch/v1
kind: Job
metadata:
  name: coyote-migrate-{{ .Values.migration.runID }}
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coyote-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.migrate.name }}
      {{- if not (and .Values.gke.enabled .Values.gke.workloadIdentity.enabled) }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.images.migrate }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL_FILE
              value: /var/run/secrets/coyote/database-url
          resources: {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: database-url
              mountPath: /var/run/secrets/coyote
              readOnly: true
      {{- if .Values.cloudSql.enabled }}
      initContainers:
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy }}
          restartPolicy: Always
          args: [{{ printf "--address=%s" .Values.cloudSql.proxy.address | quote }}, {{ printf "--port=%v" .Values.cloudSql.proxy.port | quote }}, {{ .Values.cloudSql.connectionName | quote }}]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources: {{- toYaml .Values.cloudSql.proxy.resources | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "coyote-ci.secretVolume" (dict "root" . "name" "database-url" "providerClass" "coyote-migrate-secrets" "databaseOnly" true) | nindent 8 }}
{{- end }}
