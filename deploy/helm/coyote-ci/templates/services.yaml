apiVersion: v1
kind: Service
metadata:
  name: coyote-server
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  selector:
    app.kubernetes.io/name: coyote-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  selector:
    app.kubernetes.io/name: coyote-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: coyote-frontend
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  selector:
    app.kubernetes.io/name: coyote-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: coyote-mcp
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: coyote-mcp
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
{{- end }}
