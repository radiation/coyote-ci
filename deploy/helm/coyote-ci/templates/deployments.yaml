apiVersion: apps/v1
kind: Deployment
metadata:
  name: coyote-server
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: coyote-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coyote-server}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.server.name }}
      containers:
        - name: server
          image: {{ .Values.images.server }}
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: coyote-control-plane}}]
          env:
            - {name: DATABASE_URL_FILE, value: /var/run/secrets/coyote/database-url}
            - {name: COYOTE_WORKSPACE_HELPER_CAPABILITY_SECRET_FILE, value: /var/run/secrets/coyote/workspace-helper-capability-secret}
            - {name: OIDC_CLIENT_SECRET_FILE, value: /var/run/secrets/coyote/oidc-client-secret}
            - {name: SESSION_SECRET_FILE, value: /var/run/secrets/coyote/session-secret}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 3}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            {{- if and .Values.gke.enabled .Values.gke.secretManagerCSI.enabled }}
            - {name: control-plane-secrets, mountPath: /var/run/secrets/coyote, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy }}
          args: [{{ printf "--address=%s" .Values.cloudSql.proxy.address | quote }}, {{ printf "--port=%v" .Values.cloudSql.proxy.port | quote }}, {{ .Values.cloudSql.connectionName | quote }}]
          ports: [{name: postgres, containerPort: 5432}]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources: {{- toYaml .Values.cloudSql.proxy.resources | nindent 12 }}
      volumes:
        {{- if and .Values.gke.enabled .Values.gke.secretManagerCSI.enabled }}
        - name: control-plane-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: coyote-server-secrets}
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.server.tmpSizeLimit }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coyote-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: coyote-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coyote-frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
