apiVersion: apps/v1
kind: Deployment
metadata:
  name: coyote-server
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  {{- if not .Values.server.replicasManagedExternally }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  strategy:
    {{- if eq .Values.storage.provider "filesystem" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: coyote-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coyote-server}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.server.name }}
      {{- if eq .Values.storage.provider "filesystem" }}
      securityContext: {{- toYaml .Values.storage.filesystem.securityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ .Values.images.server }}
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: coyote-control-plane}}]
          env:
            - {name: DATABASE_URL_FILE, value: /var/run/secrets/coyote/database-url}
            - {name: COYOTE_WORKSPACE_HELPER_CAPABILITY_SECRET_FILE, value: /var/run/secrets/coyote/workspace-helper-capability-secret}
            - {name: OIDC_CLIENT_SECRET_FILE, value: /var/run/secrets/coyote/oidc-client-secret}
            - {name: SESSION_SECRET_FILE, value: /var/run/secrets/coyote/session-secret}
            {{- range $name, $reference := .Values.server.extraEnvSecrets }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef: {{- toYaml $reference | nindent 18 }}
            {{- end }}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 3}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - {name: control-plane-secrets, mountPath: /var/run/secrets/coyote, readOnly: true}
            {{- if eq .Values.storage.provider "filesystem" }}
            - {name: data, mountPath: {{ .Values.storage.filesystem.mountPath | quote }}}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
          {{- if .Values.cloudSql.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy }}
          args: [{{ printf "--address=%s" .Values.cloudSql.proxy.address | quote }}, {{ printf "--port=%v" .Values.cloudSql.proxy.port | quote }}, {{ .Values.cloudSql.connectionName | quote }}]
          ports: [{name: postgres, containerPort: 5432}]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources: {{- toYaml .Values.cloudSql.proxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- include "coyote-ci.secretVolume" (dict "root" . "name" "control-plane-secrets" "providerClass" "coyote-server-secrets" "databaseOnly" false) | nindent 8 }}
        {{- if eq .Values.storage.provider "filesystem" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "coyote-ci.claimName" . }}
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.server.tmpSizeLimit }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coyote-frontend
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  {{- if not .Values.frontend.replicasManagedExternally }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: coyote-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coyote-frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- if .Values.mcp.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coyote-mcp
  namespace: {{ (include "coyote-ci.namespace" .) }}
spec:
  {{- if not .Values.mcp.replicasManagedExternally }}
  replicas: {{ .Values.mcp.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: coyote-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coyote-mcp}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.mcp.name }}
      automountServiceAccountToken: {{ and .Values.gke.enabled .Values.gke.workloadIdentity.enabled }}
      terminationGracePeriodSeconds: {{ .Values.mcp.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: {{ .Values.images.mcp }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: AUTH_MODE, value: {{ .Values.auth.mode | quote }}}
            - {name: DATABASE_URL_FILE, value: /var/run/secrets/coyote/database-url}
            - {name: MCP_LISTEN_ADDR, value: "0.0.0.0:8081"}
            {{- if and .Values.mcp.auth.omitEmptyAllowedOrigins (not .Values.mcp.auth.allowedOrigins) }}
            - {name: MCP_ALLOWED_ORIGINS}
            {{- else }}
            - {name: MCP_ALLOWED_ORIGINS, value: {{ join "," .Values.mcp.auth.allowedOrigins | quote }}}
            {{- end }}
            - {name: MCP_ALLOW_DISABLED_AUTH, value: "false"}
          ports: [{name: http, containerPort: 8081}]
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 3}
          resources: {{- toYaml .Values.mcp.resources | nindent 12 }}
          volumeMounts:
            - {name: database-url, mountPath: /var/run/secrets/coyote, readOnly: true}
          {{- if .Values.cloudSql.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.images.cloudSqlProxy }}
          args: [{{ printf "--address=%s" .Values.cloudSql.proxy.address | quote }}, {{ printf "--port=%v" .Values.cloudSql.proxy.port | quote }}, {{ .Values.cloudSql.connectionName | quote }}]
          ports: [{name: postgres, containerPort: 5432}]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources: {{- toYaml .Values.cloudSql.proxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- include "coyote-ci.secretVolume" (dict "root" . "name" "database-url" "providerClass" "coyote-mcp-secrets" "databaseOnly" true) | nindent 8 }}
{{- end }}
