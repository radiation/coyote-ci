{{- if and (eq .Values.storage.provider "filesystem") (not .Values.storage.filesystem.existingClaim) (or (not .Values.migration.render) (gt (int .Values.server.replicas) 0)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "coyote-ci.claimName" . }}
  namespace: {{ include "coyote-ci.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: {{ .Values.storage.filesystem.accessModes | toJson }}
  {{- if ne .Values.storage.filesystem.storageClassName nil }}
  storageClassName: {{ .Values.storage.filesystem.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.filesystem.size | quote }}
{{- end }}