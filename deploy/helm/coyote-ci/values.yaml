namespace: ""
executionNamespace: ""
allowSharedExecutionNamespace: false

rbac:
  tokenReviewNameOverride: ""

gke:
  enabled: false
  secretManagerCSI:
    enabled: false
  workloadIdentity:
    enabled: false

images:
  server: ""
  frontend: ""
  migrate: ""
  mcp: ""
  worker: ""
  cloudSqlProxy: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4@sha256:88501f0a695a586988add1b8a206fdf3f29f9a1a3deeb9b45ef2b1481ea6be83
release:
  version: ""
  channel: ""
  manifestDigest: ""
compatibility:
  schema_target: ""
  upgrade_from: ""

serviceAccounts:
  server:
    name: coyote-server
    gsaEmail: ""
    annotations: {}
  migrate:
    name: coyote-migrate
    gsaEmail: ""
    annotations: {}
  mcp:
    name: coyote-mcp
    gsaEmail: ""
    annotations: {}
  workspaceHelperName: coyote-workspace-helper
  worker:
    name: coyote-kubernetes-worker
    gsaEmail: ""
    annotations: {}

worker:
  enabled: false
  name: coyote-kubernetes-worker
  configMapName: coyote-worker
  databaseSecretProviderClass: coyote-worker-database-secrets
  replicas: 1
  replicasManagedExternally: false
  maxInFlightJobs: 1
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  extraEnvSecrets: {}
  internalAPIURL: ""
  secrets:
    existingSecrets:
      databaseUrl: {name: "", key: ""}
    project: ""
    databaseUrl: ""

cloudBuild:
  enabled: false
  project: ""
  location: ""
  runtimeServiceAccount: ""
  artifactRegistryRepository: ""
  source: {bucket: "", prefix: coyote-sources}

cloudSql:
  enabled: false
  connectionName: ""
  proxy:
    address: 127.0.0.1
    port: 5432
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}

secrets:
  existingSecrets:
    databaseUrl: {name: "", key: ""}
    workspaceHelperCapability: {name: "", key: ""}
    oidcClient: {name: "", key: ""}
    session: {name: "", key: ""}
  project: ""
  databaseUrl: ""
  workspaceHelperCapability: ""
  oidcClient: ""
  session: ""

storage:
  provider: filesystem
  filesystem:
    existingClaim: ""
    size: 10Gi
    storageClassName: null
    accessModes: [ReadWriteOnce]
    mountPath: /var/lib/coyote
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
  project: ""
  artifacts: {bucket: "", prefix: builds}
  cache: {bucket: "", prefix: coyote-ci/cache}
  workspaceRevisions: {bucket: "", prefix: workspace-revisions}

auth:
  mode: oidc
  bootstrapAdminEmails: ""
  oidc:
    issuerURL: ""
    clientID: ""
    redirectURL: ""
    scopes: openid email profile
  publicURL: ""

server:
  extraEnvSecrets: {}
  replicas: 1
  replicasManagedExternally: false
  resources:
    requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
  tmpSizeLimit: 4Gi

frontend:
  replicas: 1
  replicasManagedExternally: false
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}

migration:
  activeDeadlineSeconds: 600
  sourceVersion: ""
  onlineUpgradeApproved: false
  maintenanceAcknowledged: false
  resources:
    requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}

mcp:
  enabled: false
  replicas: 1
  replicasManagedExternally: false
  terminationGracePeriodSeconds: 30
  service:
    port: 8081
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  auth:
    allowedOrigins: []
    omitEmptyAllowedOrigins: false
    allowDisabledAuth: false

gateway:
  enabled: false
  name: coyote-temporary-public
  hostname: ""
  addressName: ""
  certificateMap: ""
  className: gke-l7-global-external-managed
