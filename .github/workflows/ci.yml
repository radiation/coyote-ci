name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/codeql.yml'
            mcp:
              - 'mcp/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Verify swagger docs are up to date
        run: |
          make swagger
          git diff --exit-code backend/docs
        working-directory: .

      - name: Verify formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "These files need formatting:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests with coverage
        working-directory: backend
        shell: bash
        run: |
          # Avoid packages without test files here; Go 1.26 coverage can fail on
          # those packages in this repo even though plain `go test ./...` passes.
          mapfile -t packages < <(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No Go test packages found"
            exit 1
          fi
          go test -covermode=atomic -coverprofile=coverage.out "${packages[@]}"

      - name: Verify coverage file
        working-directory: backend
        run: |
          test -s coverage.out
          ls -l coverage.out
          head -n 5 coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Build coverage HTML
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  ci-summary:
    name: CI Summary
    needs:
      - changes
      - backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure required module jobs passed or were not needed
        run: |
          echo "backend changed: ${{ needs.changes.outputs.backend }}"

          if [ "${{ needs.changes.outputs.backend }}" = "true" ] && [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Backend CI failed"
            exit 1
          fi

          echo "All required CI checks passed"
