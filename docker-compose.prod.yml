services:
  migrate:
    image: golang:${GO_VERSION}
    container_name: coyote-ci-migrate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ./backend/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'go run github.com/pressly/goose/v3/cmd/goose@v3.24.1 -dir "$${GOOSE_MIGRATION_DIR}" postgres "$${DATABASE_URL}" up'
    restart: "no"

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    container_name: coyote-ci-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_PORT: "8080"
      ARTIFACT_STORAGE_ROOT: /var/lib/coyote-artifacts

      DATABASE_URL: ${DATABASE_URL}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-coyote_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      COYOTE_PUBLIC_URL: ${COYOTE_PUBLIC_URL:-}

      ARTIFACT_STORAGE_PROVIDER: ${ARTIFACT_STORAGE_PROVIDER}
      ARTIFACT_GCS_BUCKET: ${ARTIFACT_GCS_BUCKET}
      ARTIFACT_GCS_PREFIX: ${ARTIFACT_GCS_PREFIX}
      ARTIFACT_GCS_PROJECT: ${ARTIFACT_GCS_PROJECT}
    ports:
      - "8080:8080"
    volumes:
      - artifact_data:/var/lib/coyote-artifacts

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ARTIFACT_STORAGE_ROOT: /var/lib/coyote-artifacts
      DATABASE_URL: ${DATABASE_URL}

      ARTIFACT_STORAGE_PROVIDER: ${ARTIFACT_STORAGE_PROVIDER}
      ARTIFACT_GCS_BUCKET: ${ARTIFACT_GCS_BUCKET}
      ARTIFACT_GCS_PREFIX: ${ARTIFACT_GCS_PREFIX}
      ARTIFACT_GCS_PROJECT: ${ARTIFACT_GCS_PROJECT}
      COYOTE_PUBLIC_URL: ${COYOTE_PUBLIC_URL:-}

      WORKER_EXECUTION_WORKSPACE_ROOT: /tmp/coyote-builds
      WORKER_MOUNT_DOCKER_SOCKET: "true"
    entrypoint: ["/app/worker"]
    volumes:
      - artifact_data:/var/lib/coyote-artifacts
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/coyote-builds:/tmp/coyote-builds

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coyote-ci-frontend
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  artifact_data:
