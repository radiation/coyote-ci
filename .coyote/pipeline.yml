version: 1
pipeline:
  name: coyote-ci
  image: golang:1.27.1
steps:
  - name: Backend Format Check
    depends_on: []
    run: test -z "$(gofmt -l .)"
    working_dir: backend
    timeout_seconds: 300
    cache:
      preset: go
      policy: pull-push

  - name: Backend Dependencies
    depends_on: []
    run: go mod download
    working_dir: backend
    timeout_seconds: 600
    cache:
      preset: go
      policy: pull-push

  - name: Frontend Install
    depends_on: []
    run: npm ci
    working_dir: frontend
    image: node@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f
    timeout_seconds: 600
    cache:
      preset: node
      policy: pull-push

  - name: Backend Vet
    depends_on:
      - Backend Dependencies
    run: go vet ./...
    working_dir: backend
    timeout_seconds: 300
    cache:
      preset: go
      policy: pull-push

  - name: Backend Test
    depends_on:
      - Backend Dependencies
    run: go test ./...
    working_dir: backend
    timeout_seconds: 600
    cache:
      preset: go
      policy: pull-push

  - name: Frontend Test
    depends_on:
      - Frontend Install
    run: npm test
    working_dir: frontend
    image: node@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f
    timeout_seconds: 600
    cache:
      preset: node
      policy: pull-push

  - name: Backend Build Server
    depends_on:
      - Backend Vet
      - Backend Test
    run: go build -o dist/coyote-server ./cmd/server
    working_dir: backend
    timeout_seconds: 300
    cache:
      preset: go
      policy: pull-push

  - name: Backend Build Worker
    depends_on:
      - Backend Vet
      - Backend Test
    run: go build -o dist/coyote-worker ./cmd/worker
    working_dir: backend
    timeout_seconds: 300
    cache:
      preset: go
      policy: pull-push

  - name: Frontend Build
    depends_on:
      - Frontend Test
    run: npm run build
    working_dir: frontend
    image: node@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f
    timeout_seconds: 600
    cache:
      preset: node
      policy: pull-push

  - name: Backend Image
    depends_on:
      - Backend Format Check
      - Backend Build Server
      - Backend Build Worker
    image_build:
      context: backend
      dockerfile: backend/Dockerfile
      build_args:
        GO_VERSION: "1.27.1"
      image: coyote-ci/backend
    timeout_seconds: 600

  - name: Frontend Image
    depends_on:
      - Frontend Build
    image_build:
      context: frontend
      dockerfile: frontend/Dockerfile
      image: coyote-ci/frontend
    timeout_seconds: 600
